version: "2"
linters:
  default: none
  enable:
    - govet
    - revive
  settings:
    revive:
      confidence: 0.8
      severity: warning
      rules:
        - name: add-constant
          arguments:
            - allowFloats: 0.0,0.,1.0,1.,2.0,2.
              allowInts: 0,1,2,3,4,5,0700,0660,0o700,0o660
              allowStrs: '"",":"'
              maxLitCount: "3"
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - revive
        path: (.+)_test\.go
        text: 'add-constant:'
      - linters:
          - revive
        path: (.+)_test\.go
        text: 'exported:'
      - linters:
          - revive
        path: langserver/diff.go
        text: 'var-naming: don''t use leading k in Go names'
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mattn/efm-langserver
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - langserver/handler_go112.go
      - langserver/handler_go113.go
